name: Build Docs Preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - 'content/**'
      - 'assets/**'
      - 'layouts/**'
      - 'data/**'
      - '**.md'
      - '**.go'
      - 'hugo.toml'
      - '.github/workflows/build-docs-preview.yml'
      - '.github/workflows/deploy-docs-preview.yml'

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.158.0

    steps:
      # Hugo Module fetching hits proxy.golang.org and sum.golang.org. Harmless
      # under egress-policy: audit, but if this is promoted to block, those two
      # plus objects.githubusercontent.com must be in allowed-endpoints or the
      # build dies at module resolution.
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      # Same key as hugo.yaml, so a PR build restores the WebP versions encoded
      # on master and only encodes images the PR adds or changes.
      - name: Cache Hugo image processing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml', 'layouts/_default/_markup/render-image.html',
            'content/**/*.png', 'content/**/*.PNG', 'content/**/*.jpg', 'content/**/*.JPG', 'content/**/*.jpeg', 'content/**/*.JPEG',
            'assets/**/*.png', 'assets/**/*.PNG', 'assets/**/*.jpg', 'assets/**/*.JPG', 'assets/**/*.jpeg', 'assets/**/*.JPEG') }}
          restore-keys: hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Build PR preview
        env:
          HUGO_PREVIEW: "true"
          BASE_URL: /pr-preview/pr-${{ github.event.pull_request.number }}/
        run: |
          npm run build:preview
          cat > public/robots.txt <<'ROBOTS'
          User-agent: *
          Disallow: /
          ROBOTS

      - name: Save PR Metadata
        run: |
          mkdir -p pr
          echo "${{ github.event.action }}" > pr/action
          echo "${{ github.event.number }}" > pr/number
          echo "${{ github.event.pull_request.head.sha }}" > pr/sha

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-build
          path: |
            public/
            pr/
          if-no-files-found: error
          retention-days: 7
